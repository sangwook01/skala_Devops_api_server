apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk006-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk006-webserver
  template:
    metadata:
      labels:
        app: sk006-webserver
    spec:
      containers:
        - name: webserver
          image: skala-registry.skala-ai.com/class-1/sk006-webserver:1.0
          ports:
            - containerPort: 8080
